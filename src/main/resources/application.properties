spring.application.name=springboot-applications
server.port=8080

# Conexion 
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_seguridad_drms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clave secreta
jwt.secret=${JWT_SECRET:ClaveSecretaSuperSeguraParaMagaliSaraiDiegoRevillaAct4Tema4_2026!}
jwt.expiration=86400000
spring.thymeleaf.cache=false